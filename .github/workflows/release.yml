name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: telegram-wizard-windows-x64.exe
          - os: ubuntu-latest
            asset: telegram-wizard-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Self-test
        shell: bash
        run: |
          node wizard.js --selftest
          node test-reliability.mjs
      - name: Build standalone ${{ matrix.asset }}
        shell: bash
        run: |
          STAGE="${{ runner.temp }}/ttd-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp wizard.js package.json package-lock.json "$STAGE/"
          cp -r src "$STAGE/"
          cp -r node_modules "$STAGE/"
          npx --yes caxa --input "$STAGE" --output "${{ matrix.asset }}" -- node "{{caxa}}/wizard.js"
      - name: Smoke-test binary
        shell: bash
        run: ./${{ matrix.asset }} --selftest
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
